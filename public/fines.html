<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fines - Digital Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Digital Library</a>
      <ul class="navbar-nav ms-auto flex-row gap-3 align-items-center" id="authLinks"></ul>
    </div>
  </nav>

  <div class="container my-4">
    <h2 class="mb-3">Fines</h2>
    <div id="message"></div>

    <div class="row g-3 mb-4" id="summary"></div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h4 class="mb-0">Fine Records</h4>
      <select id="statusFilter" class="form-select w-auto">
        <option value="unpaid">Unpaid fines</option>
        <option value="paid">Paid fines</option>
      </select>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th><th>Student</th><th>Book</th><th>Due</th><th>Returned</th>
              <th>Late days</th><th>Fine (Rs.)</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="fineTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/fines.js"></script>
</body>
</html>
