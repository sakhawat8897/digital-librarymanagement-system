<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books - Digital Library</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Digital Library</a>
      <ul class="navbar-nav ms-auto flex-row gap-3 align-items-center" id="authLinks"></ul>
    </div>
  </nav>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Book Catalog</h2>
      <button id="addBookBtn" class="btn btn-success d-none">+ Add Book</button>
    </div>

    <div id="message"></div>

    <!-- Search -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <form id="searchForm" class="row g-2">
          <div class="col-md-5">
            <input type="text" id="searchInput" class="form-control"
                   placeholder="Search by title, author or category">
          </div>
          <div class="col-md-4">
            <select id="categoryFilter" class="form-select">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">Search</button>
            <button type="button" id="clearBtn" class="btn btn-outline-secondary flex-fill">Clear</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Results -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Title</th><th>Author</th><th>Category</th><th>ISBN</th>
              <th>Shelf</th><th>Availability</th><th id="actionsHeader" class="d-none">Actions</th>
            </tr>
          </thead>
          <tbody id="bookTable"></tbody>
        </table>
      </div>
    </div>
    <p class="text-muted mt-2" id="resultCount"></p>
  </div>

  <!-- Add / Edit window (librarian only) -->
  <div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Book</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalMessage"></div>
          <form id="bookForm">
            <input type="hidden" id="bookId">
            <div class="mb-2"><label class="form-label">Title *</label>
              <input type="text" id="title" class="form-control" required></div>
            <div class="mb-2"><label class="form-label">Author *</label>
              <input type="text" id="author" class="form-control" required></div>
            <div class="mb-2"><label class="form-label">ISBN *</label>
              <input type="text" id="isbn" class="form-control" required></div>
            <div class="row">
              <div class="col-6 mb-2"><label class="form-label">Category</label>
                <input type="text" id="category" class="form-control"></div>
              <div class="col-6 mb-2"><label class="form-label">Publisher</label>
                <input type="text" id="publisher" class="form-control"></div>
            </div>
            <div class="row">
              <div class="col-4 mb-2"><label class="form-label">Year</label>
                <input type="number" id="publication_year" class="form-control"></div>
              <div class="col-4 mb-2"><label class="form-label">Shelf</label>
                <input type="text" id="shelf_location" class="form-control"></div>
              <div class="col-4 mb-2"><label class="form-label">Total copies *</label>
                <input type="number" id="total_copies" class="form-control" min="0" value="1" required></div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Save Book</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/books.js"></script>
</body>
</html>
