<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Books - Digital Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Digital Library</a>
      <ul class="navbar-nav ms-auto flex-row gap-3 align-items-center flex-wrap" id="authLinks"></ul>
    </div>
  </nav>

  <div class="container my-4">
    <h2 class="mb-3">My Books</h2>
    <div id="message"></div>

    <div class="row g-3 mb-4" id="summary"></div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Book</th><th>Author</th><th>Issued</th><th>Due</th>
              <th>Returned</th><th>Fine (Rs.)</th><th>Status</th><th>Renewal</th>
            </tr>
          </thead>
          <tbody id="myTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/my-books.js"></script>
</body>
</html>
