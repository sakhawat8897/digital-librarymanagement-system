<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue & Return - Digital Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Digital Library</a>
      <ul class="navbar-nav ms-auto flex-row gap-3 align-items-center" id="authLinks"></ul>
    </div>
  </nav>

  <div class="container my-4">
    <h2 class="mb-3">Issue &amp; Return Books</h2>
    <div id="message"></div>

    <!-- Issue form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title">Issue a Book</h5>
        <form id="issueForm" class="row g-2">
          <div class="col-md-5">
            <select id="studentSelect" class="form-select" required>
              <option value="">Select student</option>
            </select>
          </div>
          <div class="col-md-5">
            <select id="bookSelect" class="form-select" required>
              <option value="">Select book (only available books)</option>
            </select>
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Issue</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Records -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h4 class="mb-0">Issue Records</h4>
      <select id="statusFilter" class="form-select w-auto">
        <option value="">All records</option>
        <option value="active">Currently issued</option>
        <option value="overdue">Overdue</option>
        <option value="returned">Returned</option>
      </select>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th><th>Student</th><th>Book</th><th>Issued</th><th>Due</th>
              <th>Returned</th><th>Late days</th><th>Fine (Rs.)</th><th>Status</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="issueTable"></tbody>
        </table>
      </div>
    </div>
    <p class="text-muted mt-2" id="resultCount"></p>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/issues.js"></script>
</body>
</html>
