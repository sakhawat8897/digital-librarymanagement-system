<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renewals - Digital Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Digital Library</a>
      <ul class="navbar-nav ms-auto flex-row gap-3 align-items-center flex-wrap" id="authLinks"></ul>
    </div>
  </nav>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0" id="pageTitle">Renewals</h2>
      <select id="statusFilter" class="form-select w-auto d-none">
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="">All</option>
      </select>
    </div>
    <div id="message"></div>
    <p class="text-muted" id="helpText"></p>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark"><tr id="tableHead"></tr></thead>
          <tbody id="renewalTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/renewals.js"></script>
</body>
</html>
